[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Provider-agnostic deep research agent with span-verified evidence and citation-closed reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "ddgs>=9.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["research_agent*", "evals*", "web*"]

[tool.setuptools.package-data]
evals = ["dataset.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
